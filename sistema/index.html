*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh;overflow-x:hidden}
.wm{position:fixed;left:50%;top:50%;transform:translate(-50%,-46%);height:min(78vh,620px);width:auto;max-width:92vw;fill:var(--wm);pointer-events:none;z-index:0}

p.txt{color:var(--muted);font-size:14px;line-height:1.7;margin:0 auto 34px;max-width:360px}
.btn{display:inline-flex;align-items:center;gap:12px;font-family:var(--display);font-weight:500;font-size:13px;letter-spacing:.18em;text-transform:uppercase;text-decoration:none;
padding:17px 30px;border:1px solid var(--acc);background:var(--acc);color:#fff;border-radius:2px;transition:transform .25s ease,box-shadow .25s ease}
.btn:hover{transform:translateY(-3px);box-shadow:var(--sombra)}
.btn:focus-visible{outline:2px solid var(--acc-txt);outline-offset:3px}
.btn svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.nota{margin-top:30px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:8px}
.nota svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;flex:none}
footer{position:relative;z-index:1;border-top:1px solid var(--rule);padding:18px 16px;text-align:center;font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
footer a{color:inherit;text-decoration:none}
footer a:hover{color:var(--fg)}
